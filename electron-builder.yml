{
  "appId": "app.aragon.browser",
  "productName": "aragon-browser",
  "copyright": "Copyright (c) 2026 aragon-browser contributors",
  "directories": {
    "output": "dist",
    "buildResources": "build"
  },
  "files": [
    "src/main/**/*",
    "src/kernel/**/*",
    "src/renderer/**/*",
    "src/preload/**/*",
    "src/shared/**/*",
    "package.json"
  ],
  "extraResources": [
    {
      "from": "bin",
      "to": "cli"
    },
    {
      "from": "skills/aragon-browser",
      "to": "skills/aragon-browser"
    }
  ],
  "asar": true,
  "asarUnpack": [],
  "win": {
    "target": [
      {
        "target": "nsis",
        "arch": ["x64"]
      },
      {
        "target": "portable",
        "arch": ["x64"]
      }
    ],
    "icon": "build/icon.png",
    "artifactName": "aragon-browser-${version}-${arch}.${ext}",
    "signAndEditExecutable": true
  },
  "nsis": {
    "oneClick": false,
    "perMachine": false,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true,
    "shortcutName": "aragon-browser",
    "uninstallDisplayName": "aragon-browser ${version}",
    "deleteAppDataOnUninstall": false
  },
  "portable": {
    "artifactName": "aragon-browser-${version}-portable.${ext}"
  },
  "mac": {
    "target": ["dmg"],
    "category": "public.app-category.developer-tools",
    "icon": "build/icon.png"
  },
  "linux": {
    "target": ["AppImage"],
    "category": "Development",
    "icon": "build/icon.png"
  }
}
